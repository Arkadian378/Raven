<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labyrinth RL – live</title>
<style>
  :root { --bg:#16151b; --panel:#22212a; --fg:#ece8df; --muted:#9a96a3; --wall:#5a4634; --floor:#ece0c4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; background:var(--panel); }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  main { display:flex; gap:16px; padding:16px; flex-wrap:wrap; }
  .card { background:var(--panel); border-radius:10px; padding:12px; }
  canvas { display:block; max-width:100%; }
  label { color:var(--muted); }
  select, input, button { background:#2e2c38; color:var(--fg); border:1px solid #444; border-radius:6px; padding:3px 6px; }
  .players div { margin:4px 0; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  #status { color:var(--muted); }
  .charts { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:12px; flex:1; min-width:300px; }
  .charts canvas { width:100%; height:160px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🧭 Labyrinth RL – live</h1>
  <label>Velocità <input id="speed" type="range" min="1" max="60" value="6"> <span id="speedv">6</span> mosse/s</label>
  <label><input id="live" type="checkbox" checked> segui il live</label>
  <label>Vista <select id="view">
    <option value="god">onnisciente (stato completo)</option>
    <option value="0">giocatore 0 (POMDP)</option><option value="1">giocatore 1 (POMDP)</option>
    <option value="2">giocatore 2 (POMDP)</option><option value="3">giocatore 3 (POMDP)</option>
  </select></label>
  <button id="pause">⏸ pausa</button>
  <span id="status">connessione…</span>
</header>
<main>
  <div class="card"><canvas id="board" width="560" height="560"></canvas></div>
  <div class="card" style="min-width:240px">
    <div id="info"></div>
    <h3 style="margin:12px 0 4px">Tessera libera</h3>
    <canvas id="spare" width="80" height="80"></canvas>
    <div class="players" id="players"></div>
    <div id="lastact" class="muted"></div>
  </div>
  <div class="charts" id="charts"></div>
</main>
<script>
const COLORS = ["#e6b414", "#dc322f", "#266ed2", "#28a046"];
const NAMES = ["giallo", "rosso", "blu", "verde"];
let TREASURES = [];
let queue = [], cur = null, lastSeq = 0, paused = false, metricsNext = 0, metrics = [];
const $ = id => document.getElementById(id);
$("speed").oninput = e => $("speedv").textContent = e.target.value;
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "▶ riprendi" : "⏸ pausa"; };

function drawTile(ctx, x, y, s, mask, treasure, collected, highlight) {
  ctx.fillStyle = "#5a4634"; ctx.fillRect(x, y, s, s);
  const w = s / 3; ctx.fillStyle = "#ece0c4";
  ctx.fillRect(x + w, y + w, w, w);
  if (mask & 1) ctx.fillRect(x + w, y, w, w + 1);
  if (mask & 2) ctx.fillRect(x + 2 * w - 1, y + w, w + 1, w);
  if (mask & 4) ctx.fillRect(x + w, y + 2 * w - 1, w, w + 1);
  if (mask & 8) ctx.fillRect(x, y + w, w + 1, w);
  ctx.strokeStyle = "#00000055"; ctx.strokeRect(x + .5, y + .5, s - 1, s - 1);
  if (treasure >= 0) {
    ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, w * .38, 0, 7);
    ctx.fillStyle = collected ? "#999" : "#b56ae0"; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `${Math.round(s / 5.5)}px sans-serif`;
    ctx.fillText(treasure, x + 3, y + s / 5 + 2);
  }
  if (highlight) { ctx.lineWidth = 4; ctx.strokeStyle = highlight; ctx.strokeRect(x + 2, y + 2, s - 4, s - 4); ctx.lineWidth = 1; }
}

function draw(frame) {
  const st = frame.state, view = $("view").value;
  const cv = $("board"), ctx = cv.getContext("2d");
  const m = 40, s = (cv.width - 2 * m) / 7;
  ctx.fillStyle = "#16151b"; ctx.fillRect(0, 0, cv.width, cv.height);
  const collected = new Set(st.collected || []);  // public information
  const tgt = {};
  st.targets && st.targets.forEach((t, p) => { if (view === "god" || +view === p) tgt[t] = p; });
  for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
    const t = st.treasure[r][c];
    drawTile(ctx, m + c * s, m + r * s, s, st.board[r][c], t, collected.has(t), t >= 0 && t in tgt ? COLORS[tgt[t]] : null);
  }
  st.home.forEach(([r, c], p) => { ctx.strokeStyle = COLORS[p]; ctx.setLineDash([4, 3]); ctx.lineWidth = 2;
    ctx.strokeRect(m + c * s + 6, m + r * s + 6, s - 12, s - 12); ctx.setLineDash([]); ctx.lineWidth = 1; });
  // home target
  st.targets && st.targets.forEach((t, p) => { if (t === -1 && (view === "god" || +view === p)) {
    const [r, c] = st.home[p]; ctx.lineWidth = 4; ctx.strokeStyle = COLORS[p]; ctx.strokeRect(m + c * s + 2, m + r * s + 2, s - 4, s - 4); ctx.lineWidth = 1; } });
  // insertion slots
  const forb = st.last_slot >= 0 ? (st.last_slot + 6) % 12 : -1;
  for (let k = 0; k < 12; k++) {
    const side = Math.floor(k / 3), line = [1, 3, 5][k % 3], mid = m + line * s + s / 2;
    const [x, y] = [[mid, m / 2], [cv.width - m / 2, mid], [mid, cv.height - m / 2], [m / 2, mid]][side];
    const used = st.last_slot === k;
    ctx.beginPath(); ctx.arc(x, y, used ? 8 : 6, 0, 7);
    ctx.fillStyle = k === forb ? "#444" : used ? "#ffd166" : "#ddd"; ctx.fill();
  }
  // pawns
  const offs = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  st.pos.forEach(([r, c], p) => {
    const x = m + c * s + s / 2 + offs[p][0] * s / 6, y = m + r * s + s / 2 + offs[p][1] * s / 6;
    ctx.beginPath(); ctx.arc(x, y, s / 7, 0, 7); ctx.fillStyle = COLORS[p]; ctx.fill();
    ctx.strokeStyle = p === st.current ? "#fff" : "#000"; ctx.lineWidth = p === st.current ? 3 : 1; ctx.stroke(); ctx.lineWidth = 1;
  });
  // spare
  const sc = $("spare").getContext("2d"); sc.clearRect(0, 0, 80, 80);
  drawTile(sc, 0, 0, 80, st.spare, st.spare_treasure, collected.has(st.spare_treasure), st.spare_treasure in tgt ? COLORS[tgt[st.spare_treasure]] : null);
  // panel
  const phase = st.phase === 0 ? "SPINTA (inserisci tessera)" : "MOVIMENTO";
  $("info").innerHTML = `<b>Episodio ${frame.episode}</b> · turno ${st.turn}<br>` +
    `<span style="color:${COLORS[st.current]}">● ${NAMES[st.current]}</span> – ${phase}` +
    (st.winner >= 0 ? `<br><b style="color:${COLORS[st.winner]}">🏆 vince ${NAMES[st.winner]}</b>` : "") +
    (frame.truncated ? "<br><b>troncato (max turni)</b>" : "");
  $("players").innerHTML = st.pos.map((_, p) => {
    const t = st.targets ? st.targets[p] : null;
    const show = view === "god" || +view === p;
    const tn = !show || t === null ? "?" : t === -1 ? "🏠 casa" : `${t} ${TREASURES[t] || ""}`;
    const rw = frame.rewards ? ` <span class="muted">r=${(+frame.rewards[p]).toFixed(2)}</span>` : "";
    return `<div><span class="dot" style="background:${COLORS[p]}"></span>${NAMES[p]}: ${st.found[p]}/${st.deck_sizes[p]} → ${tn}${rw}</div>`;
  }).join("");
  const la = st.last_action;
  $("lastact").textContent = !la ? "" : la[0] === "shift" ? `ultima: P${la[1]} inserisce slot ${la[2]} rot ${la[3]}` : `ultima: P${la[1]} muove in (${la[2]},${la[3]})`;
}

async function pollFrames() {
  try {
    const res = await fetch(`/frames?since=${lastSeq}`); const js = await res.json();
    if (js.frames.length) { lastSeq = js.frames[js.frames.length - 1].seq; queue.push(...js.frames); }
    if ($("live").checked && queue.length > 300) queue = queue.slice(-50);
    $("status").textContent = `in coda: ${queue.length} · frame #${js.latest}`;
  } catch (e) { $("status").textContent = "disconnesso, riprovo…"; }
  setTimeout(pollFrames, 400);
}

function tick() {
  if (!paused && queue.length) { cur = queue.shift(); draw(cur); }
  else if (cur) draw(cur);
  setTimeout(tick, 1000 / +$("speed").value);
}
$("view").onchange = () => cur && draw(cur);

// ------------------------------------------------------------- metrics
const charts = {};
function chart(name) {
  if (!charts[name]) {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<div class="muted">${name}</div><canvas width="600" height="160"></canvas>`;
    $("charts").appendChild(d); charts[name] = d.querySelector("canvas");
  }
  return charts[name];
}
function drawMetrics() {
  const keys = new Set(); metrics.forEach(m => Object.keys(m).forEach(k => k !== "step" && keys.add(k)));
  keys.forEach(k => {
    const pts = metrics.filter(m => k in m).map(m => [m.step, m[k]]); if (!pts.length) return;
    const cv = chart(k), ctx = cv.getContext("2d"), W = cv.width, H = cv.height, p = 28;
    ctx.clearRect(0, 0, W, H);
    const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1, y0 = Math.min(...ys), y1 = Math.max(...ys);
    const sy = y1 - y0 || 1, sx = x1 - x0 || 1;
    ctx.strokeStyle = "#444"; ctx.strokeRect(p, 4, W - p - 4, H - p);
    ctx.fillStyle = "#9a96a3"; ctx.font = "11px sans-serif";
    ctx.fillText(y1.toFixed(3), 2, 12); ctx.fillText(y0.toFixed(3), 2, H - p); ctx.fillText(`step ${x1}`, W - 80, H - 8);
    ctx.beginPath(); ctx.strokeStyle = "#7cc4ff"; ctx.lineWidth = 2;
    pts.forEach(([x, y], i) => { const X = p + (x - x0) / sx * (W - p - 6), Y = 4 + (1 - (y - y0) / sy) * (H - p - 4);
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = "#ece8df"; ctx.fillText(`ultimo: ${ys[ys.length - 1].toFixed(3)}`, p + 6, 18);
  });
}
async function pollMetrics() {
  try { const js = await (await fetch(`/metrics?since=${metricsNext}`)).json();
    metricsNext = js.next; if (js.metrics.length) { metrics.push(...js.metrics); drawMetrics(); } } catch (e) {}
  setTimeout(pollMetrics, 2000);
}
fetch("/meta").then(r => r.json()).then(m => TREASURES = m.treasure_names || []).catch(() => {});
pollFrames(); pollMetrics(); tick();
</script>
</body>
</html>
