[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "labyrinth-rl"
version = "0.1.0"
description = "Multi-agent POMDP environment for Ravensburger's Labyrinth, with self-play training and a live viewer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=9"]

[project.optional-dependencies]
rl = ["torch>=2.1", "gymnasium>=0.29", "pettingzoo>=1.24"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["labyrinth*", "train*"]

[tool.setuptools.package-data]
"labyrinth.viewer" = ["index.html"]
